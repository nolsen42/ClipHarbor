# Flatpak build of ClipHarbor (for Flathub). How to try it: packaging/flatpak/README.md.
id: io.github.nolsen42.ClipHarbor
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: clipharbor

finish-args:
  - --share=network
  - --share=ipc
  # Avalonia draws with X11 (it runs through XWayland on Wayland desktops).
  - --socket=x11
  - --device=dri
  # Where downloads are saved by default (Videos/ClipHarbor); other folders come through the folder picker.
  - --filesystem=xdg-videos
  - --filesystem=xdg-download
  - --filesystem=xdg-music
  # Tray icon (StatusNotifierItem), so subscriptions and downloads keep going with the window closed.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-1
  # "Use sign-in from browser" (yt-dlp --cookies-from-browser): read-only access to the browsers' cookies,
  # and the keyring that Chromium-based browsers lock them with.
  - --filesystem=~/.mozilla/firefox:ro
  - --filesystem=xdg-config/mozilla/firefox:ro
  - --filesystem=xdg-config/google-chrome:ro
  - --filesystem=xdg-config/chromium:ro
  - --filesystem=xdg-config/BraveSoftware/Brave-Browser:ro
  - --filesystem=xdg-config/microsoft-edge:ro
  - --filesystem=xdg-config/opera:ro
  - --filesystem=xdg-config/vivaldi:ro
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # ---- ffmpeg, with the encoders ClipHarbor uses (H.264 for "fit to a size", MP3, Opus, WebP) ----
  - name: x264
    config-opts:
      - --enable-shared
      - --enable-pic
      - --disable-cli
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        branch: stable
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55

  - name: lame
    config-opts:
      - --disable-static
      - --disable-frontend
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
        sha256: ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e
        x-checker-data:
          type: anitya
          project-id: 1528
          url-template: https://downloads.sourceforge.net/project/lame/lame/$version/lame-$version.tar.gz

  - name: ffmpeg
    config-opts:
      - --enable-gpl
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-debug
      - --disable-ffplay
      - --enable-libx264
      - --enable-libmp3lame
      - --enable-libopus
      - --enable-libvpx
      - --enable-libwebp
    cleanup:
      - /share/ffmpeg
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        tag: n8.1.3
        commit: 1041abdc962f4cc4f394aa8de9dc5236c0c3b9e7
        x-checker-data:
          type: git
          tag-pattern: ^n([\d.]+)$

  # ---- yt-dlp, the download engine (the zipapp runs on the runtime's Python) ----
  # Flathub's bot opens a pull request on each new yt-dlp release (x-checker-data); merging it ships the update.
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp
        sha256: e8665ed64d6b9172773e812f891fb707a0cb1ee8d9ef4fc1acb00cabee4c5256
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest
          version-query: .tag_name
          url-query: '"https://github.com/yt-dlp/yt-dlp/releases/download/" + $version + "/yt-dlp"'
          is-main-source: true

  # ---- ClipHarbor itself, built offline from source ----
  - name: clipharbor
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
        DOTNET_NOLOGO: 'true'
      arch:
        x86_64:
          env:
            RUNTIME: linux-x64
        aarch64:
          env:
            RUNTIME: linux-arm64
    build-commands:
      - >-
        dotnet publish ClipHarbor.csproj -c Release --runtime $RUNTIME --self-contained true
        --source ./nuget-sources --source /usr/lib/sdk/dotnet10/nuget/packages
        -p:DebugType=none -p:Version=1.5.1 -o /app/lib/clipharbor
      - mkdir -p /app/bin
      - ln -s /app/lib/clipharbor/ClipHarbor /app/bin/clipharbor
      - install -Dm644 packaging/flatpak/io.github.nolsen42.ClipHarbor.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.nolsen42.ClipHarbor.metainfo.xml -t /app/share/metainfo
      - install -Dm644 packaging/flatpak/io.github.nolsen42.ClipHarbor.png /app/share/icons/hicolor/512x512/apps/io.github.nolsen42.ClipHarbor.png
    sources:
      # For testing: this checkout as it is. For Flathub, swap it for the release:
      #   - type: git
      #     url: https://github.com/nolsen42/ClipHarbor.git
      #     tag: v1.x.y
      #     commit: <the tag's commit>
      - type: dir
        path: ../..
        skip:
          - .git
          - bin
          - obj
          - android
          - browser-extension
          - docs
          - shots
          - store
          - packaging/flatpak/.flatpak-builder
          - packaging/flatpak/build-dir
          - packaging/flatpak/repo
      - nuget-sources.json
