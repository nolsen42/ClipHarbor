<!doctype html>
<!-- Source of social-preview.png (1280x640), the picture shown when the repository or website is shared.
     Render: msedge --headless --hide-scrollbars --window-size=1280,640 --screenshot=social-preview.png social-preview.html -->
<html><head><meta charset="utf-8"><title>ClipHarbor social preview</title>
<style>
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
body {
  background: linear-gradient(135deg, #3b7bf2 0%, #2d5fd6 45%, #1f3f9a 100%);
  font-family: "Segoe UI", system-ui, sans-serif; color: #fff; position: relative;
}
.text { position: absolute; left: 88px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
.brand img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 10px 30px rgba(10,20,60,.35); }
.brand span { font-size: 70px; font-weight: 700; letter-spacing: -1px; }
.tag { font-size: 34px; line-height: 1.3; font-weight: 600; margin: 0 0 22px; }
.sub { font-size: 24px; line-height: 1.45; color: rgba(255,255,255,.85); margin: 0 0 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chips span { font-size: 19px; padding: 6px 14px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); }
.shot {
  position: absolute; left: 700px; top: 96px; width: 760px; border-radius: 14px; overflow: hidden;
  box-shadow: 0 24px 60px rgba(5,12,40,.5); border: 1px solid rgba(255,255,255,.18);
}
.shot img { display: block; width: 100%; }
</style></head>
<body>
  <div class="text">
    <div class="brand"><img src="../docs/icon-256.png" alt=""><span>ClipHarbor</span></div>
    <p class="tag">Free video &amp; audio downloader</p>
    <p class="sub">No ads, no account, no download caps.<br>Open source, with yt-dlp and FFmpeg.</p>
    <div class="chips"><span>Windows</span><span>macOS</span><span>Linux</span><span>Android</span></div>
  </div>
  <div class="shot"><img src="../docs/screenshot-dark.png" alt=""></div>
</body></html>
