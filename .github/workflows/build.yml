name: Build

on:
  push:
    branches: [main, avalonia-port, android]
  pull_request:
  release:
    types: [published]
  # Actions tab → Build → Run workflow. Pick "patch", "minor" or "major" to publish a new release
  # in one go: the version is worked out from the last tag, and the release notes from the commits.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release? patch = fixes (1.1.0 → 1.1.1), minor = new features (1.1.1 → 1.2.0), major = big changes (1.2.0 → 2.0.0)"
        type: choice
        options: ["no", "patch", "minor", "major"]
        default: "no"

jobs:
  # Works out the version once for every job.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
      new_release: ${{ steps.v.outputs.new_release }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # all tags, to find the last version

      - id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
          BUMP: ${{ github.event.inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release=false; new=false; skip=false
          if [ -n "$TAG" ]; then
            # A release published by hand on GitHub: its tag is the version (v1.2.0 -> 1.2.0).
            v="${TAG#[vV]}"; release=true
            # A release made by the Run workflow button already has its files; building again isn't needed.
            n=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "$TAG already has its files; nothing to do."; release=false; skip=true; fi
          elif [ -n "$BUMP" ] && [ "$BUMP" != "no" ]; then
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
            last="${last#v}"; last="${last%%-*}"; [ -z "$last" ] && last=0.0.0
            IFS=. read -r a b c <<< "$last"; a=${a:-0}; b=${b:-0}; c=${c:-0}
            case "$BUMP" in
              major) a=$((a + 1)); b=0; c=0 ;;
              minor) b=$((b + 1)); c=0 ;;
              *)     c=$((c + 1)) ;;
            esac
            v="$a.$b.$c"; TAG="v$v"; release=true; new=true
            echo "Last release: v$last  ->  new release: $TAG"
          else
            # Everyday builds carry the last release's number, so their updater doesn't take them for an old
            # version and "update" them back to the last release. (Falls back to ClipHarbor.csproj.)
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
            v="${last#v}"; v="${v%%-*}"
            [ -z "$v" ] && v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ClipHarbor.csproj)
          fi
          echo "Version: $v"
          { echo "version=$v"; echo "tag=$TAG"; echo "release=$release"; echo "new_release=$new"; echo "skip=$skip"; } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     name: windows-x64 }
          - { os: ubuntu-latest,  rid: linux-x64,   name: linux-x64 }
          - { os: ubuntu-latest,  rid: linux-arm64, name: linux-arm64 }
          - { os: macos-latest,   rid: osx-arm64,   name: macos-apple-silicon }
          - { os: macos-latest,   rid: osx-x64,     name: macos-intel }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish (self-contained, single file)
        run: dotnet publish -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=${{ env.VERSION }} -p:UpdateRepo=${{ github.repository }} -o publish --nologo

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item publish/ClipHarbor.exe dist/

      # Installer (Start menu, Settings → Apps entry), per user, next to the portable .exe.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $v = "$env:VERSION" -replace '-.*$', ''   # Windows version numbers are digits and dots only
          & $iscc /Qp "/DAppVersion=$v" "/DSourceExe=$PWD\publish\ClipHarbor.exe" "/DOutDir=$PWD\dist" packaging\windows\ClipHarbor.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist ClipHarbor
          cp publish/ClipHarbor README.md LICENSE ClipHarbor/
          chmod +x ClipHarbor/ClipHarbor
          tar -czf dist/ClipHarbor-${{ matrix.name }}.tar.gz ClipHarbor

      # One-file AppImage with its icon and menu entry. appimagetool and the type2 runtime come from the
      # AppImage project; the static runtime doesn't need libfuse2, which newer Ubuntu leaves out.
      - name: Package for Linux (AppImage)
        if: runner.os == 'Linux'
        continue-on-error: true   # a problem here never holds up the .tar.gz or the release
        run: |
          case "${{ matrix.rid }}" in linux-arm64) arch=aarch64 ;; *) arch=x86_64 ;; esac
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fsSL -o runtime https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-$arch
          chmod +x appimagetool
          D=ClipHarbor.AppDir
          mkdir -p $D/usr/bin $D/usr/share/applications $D/usr/share/icons/hicolor/256x256/apps
          cp publish/ClipHarbor $D/usr/bin/ && chmod +x $D/usr/bin/ClipHarbor
          printf '#!/bin/sh\nexec "$(dirname "$(readlink -f "$0")")/usr/bin/ClipHarbor" "$@"\n' > $D/AppRun && chmod +x $D/AppRun
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=ClipHarbor' 'Comment=Video and audio downloader' \
            'Exec=ClipHarbor %u' 'Icon=io.github.clipharbor' 'Terminal=false' 'Categories=AudioVideo;Network;' \
            'MimeType=x-scheme-handler/clipharbor;' > $D/io.github.clipharbor.desktop
          cp $D/io.github.clipharbor.desktop $D/usr/share/applications/
          convert assets/ClipHarbor.png -resize 256x256 $D/io.github.clipharbor.png 2>/dev/null || cp assets/ClipHarbor.png $D/io.github.clipharbor.png
          cp $D/io.github.clipharbor.png $D/usr/share/icons/hicolor/256x256/apps/
          ln -sf io.github.clipharbor.png $D/.DirIcon
          ARCH=$arch APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --runtime-file runtime --no-appstream $D dist/ClipHarbor-${{ matrix.name }}.AppImage
          chmod +x dist/ClipHarbor-${{ matrix.name }}.AppImage
          ls -la dist

      - name: Package for macOS (.app)
        if: runner.os == 'macOS'
        run: |
          APP=ClipHarbor.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist icon.iconset
          cp publish/ClipHarbor "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/ClipHarbor"
          cp packaging/macos/Info.plist "$APP/Contents/"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$APP/Contents/Info.plist"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/ClipHarbor.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/ClipHarbor.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/ClipHarbor.icns"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" dist/ClipHarbor-${{ matrix.name }}.zip

      # Screenshot check: start the app, draw a picture of the window, and make sure it worked.
      - name: Screenshot check (Windows)
        continue-on-error: true
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process publish/ClipHarbor.exe -ArgumentList '--screenshot','shot.png' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'App did not finish' }
          if (-not (Test-Path shot.png)) { throw 'No screenshot' }

      - name: Screenshot check (Linux)
        continue-on-error: true
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libice6 libsm6 libfontconfig1 >/dev/null
          timeout 60 xvfb-run -a ./publish/ClipHarbor --screenshot shot.png
          test -s shot.png
          # The AppImage too (unpacked to run, since the runner may not have FUSE).
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 90 xvfb-run -a ./dist/ClipHarbor-linux-x64.AppImage --screenshot shot-appimage.png
          test -s shot-appimage.png

      - name: Screenshot check (macOS)
        continue-on-error: true
        if: matrix.rid == 'osx-arm64'
        run: |
          perl -e 'alarm 60; exec @ARGV' ./ClipHarbor.app/Contents/MacOS/ClipHarbor --screenshot shot.png
          test -s shot.png

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshot-${{ matrix.name }}
          path: shot*.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: ClipHarbor-${{ matrix.name }}
          path: dist/

  # ClipHarbor for Android (android/ClipHarbor.Android.csproj): one APK for 64-bit ARM phones.
  # Releases need the same signing key every time, or phones won't install updates over the old version:
  # secrets ANDROID_KEYSTORE (the .keystore file, base64), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS.
  # Without them the APK is signed with a throwaway test key and isn't attached to releases.
  android:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install .NET for Android
        run: dotnet workload install android --skip-manifest-update

      - name: Build the APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE: ${{ needs.plan.outputs.release }}
        run: |
          v="${VERSION%%-*}"
          IFS=. read -r a b c <<< "$v"
          code=$(( ${a:-0} * 10000 + ${b:-0} * 100 + ${c:-0} ))   # 1.4.0 -> 10400: always higher for a newer release
          sign=()
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            sign=(-p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore" "-p:AndroidSigningKeyAlias=$KEY_ALIAS"
                  "-p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD" "-p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD")
          else
            echo "::warning::No Android signing key in the repository secrets; this APK uses a test key and isn't attached to releases."
          fi
          dotnet publish android/ClipHarbor.Android.csproj -c Release -o publish-android --nologo \
            "-p:Version=$v" "-p:ApplicationVersion=$code" "-p:UpdateRepo=$GITHUB_REPOSITORY" "-p:AndroidSdkDirectory=$ANDROID_HOME" "${sign[@]}"
          mkdir -p dist-android
          apk=$(ls publish-android/*-Signed.apk | head -n 1)
          if [ -n "$KEYSTORE_B64" ] || [ "$RELEASE" != "true" ]; then cp "$apk" dist-android/ClipHarbor-android.apk; fi
          ls -la publish-android dist-android

      - uses: actions/upload-artifact@v6
        with:
          name: ClipHarbor-android
          path: dist-android/
          if-no-files-found: ignore

  # The "Send to ClipHarbor" browser extension, one zip per browser family, with the release's version number.
  # Chrome uses background.service_worker, Firefox background.scripts; each zip keeps only its own.
  # The copy for the Chrome Web Store is switched off on YouTube (skip-sites.json), which that store doesn't allow.
  browser-extension:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Zip the extension
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          v="${VERSION%%-*}"   # browsers only accept numbers and dots
          mkdir dist store-upload   # (store/ is taken: it holds the listing text and images)
          make() {  # make <zip path> <jq filter> <skip-sites json>
            rm -rf out && cp -r browser-extension out
            jq --arg v "$v" ".version = \$v | $2" browser-extension/manifest.json > out/manifest.json
            echo "$3" > out/skip-sites.json
            (cd out && zip -r -X "../$1" .)
          }
          chrome='del(.background.scripts, .browser_specific_settings)'
          make dist/ClipHarbor-extension-chrome.zip   "$chrome" '[]'
          # Firefox copies installed from the signed .xpi look for newer versions in the latest release's updates.json.
          export UPDATE_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/updates.json"
          # Mozilla signs each version number only once, so the Firefox copy adds the run number (1.2.0.41).
          # A release that is run again (after a failed release step) then still gets a signed add-on.
          export FF_VERSION="$v.$GITHUB_RUN_NUMBER"
          make dist/ClipHarbor-extension-firefox.zip  'del(.background.service_worker) | .browser_specific_settings.gecko.update_url = env.UPDATE_URL | .version = env.FF_VERSION' '[]'
          make store-upload/chrome-web-store.zip      "$chrome" '["youtube.com","youtu.be","youtube-nocookie.com"]'
          ls -la dist store-upload

      # Releases only: Mozilla signs the Firefox add-on (unlisted), so it installs permanently and updates itself.
      # Needs the repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (API keys from addons.mozilla.org);
      # without them this step is skipped. A failure here doesn't stop the release.
      - name: Sign the Firefox add-on with Mozilla
        if: needs.plan.outputs.release == 'true'
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then echo "No Mozilla API keys set; not signing."; exit 0; fi
          rm -rf ff signed && mkdir ff signed-out
          (cd ff && unzip -q ../dist/ClipHarbor-extension-firefox.zip)
          npx --yes web-ext@8 sign --channel unlisted --source-dir ff --artifacts-dir signed --approval-timeout 1200000
          cp "$(ls signed/*.xpi | head -n 1)" signed-out/ClipHarbor-extension-firefox.xpi
          jq -n \
            --arg id "$(jq -r .browser_specific_settings.gecko.id ff/manifest.json)" \
            --arg v "$(jq -r .version ff/manifest.json)" \
            --arg link "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/ClipHarbor-extension-firefox.xpi" \
            --arg hash "sha256:$(sha256sum signed-out/ClipHarbor-extension-firefox.xpi | cut -d' ' -f1)" \
            '{addons: {($id): {updates: [{version: $v, update_link: $link, update_hash: $hash}]}}}' > signed-out/updates.json
          cat signed-out/updates.json

      - uses: actions/upload-artifact@v6
        if: hashFiles('signed-out/*.xpi') != ''
        with:
          name: ClipHarbor-extension-signed
          path: signed-out/

      # Only for uploading to the Chrome Web Store; not attached to releases.
      - uses: actions/upload-artifact@v6
        with:
          name: chrome-web-store-upload
          path: store-upload/

      - uses: actions/upload-artifact@v6
        with:
          name: ClipHarbor-browser-extension
          path: dist/

  # Releases only: the Flatpak (packaging/flatpak), one build per processor type. It builds ffmpeg from
  # source, so the first run takes a while; later runs reuse the build cache.
  flatpak:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Flatpak tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder >/dev/null
          # Ubuntu 24.04 blocks the user namespaces Flatpak's sandbox (bubblewrap) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - uses: actions/cache@v4
        with:
          path: packaging/flatpak/.flatpak-builder
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/io.github.nolsen42.ClipHarbor.yml', 'packaging/flatpak/nuget-sources.json') }}
          restore-keys: flatpak-${{ matrix.arch }}-

      - name: Build
        working-directory: packaging/flatpak
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${VERSION%%-*}"
          # The newest yt-dlp (the manifest's pinned one may be weeks old): its release tag and checksum.
          api=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest || true)
          tag=$(jq -r '.tag_name // empty' <<< "$api")
          sha=$(jq -r '.assets[]? | select(.name == "yt-dlp") | .digest // empty' <<< "$api" | sed 's/^sha256://')
          if [ -n "$tag" ] && [ ${#sha} -eq 64 ]; then
            sed -i "/releases\/download\/.*\/yt-dlp\$/{s#download/[^/]*/yt-dlp#download/$tag/yt-dlp#;n;s#sha256: .*#sha256: $sha#}" io.github.nolsen42.ClipHarbor.yml
            echo "yt-dlp $tag"
          fi
          grep -A1 'releases/download/.*/yt-dlp$' io.github.nolsen42.ClipHarbor.yml
          sed -i "s/-p:Version=[0-9][0-9.]*/-p:Version=$v/" io.github.nolsen42.ClipHarbor.yml
          # The store listing shows the newest <release>; add this one if it isn't written yet.
          m=io.github.nolsen42.ClipHarbor.metainfo.xml
          grep -q "release version=\"$v\"" $m || sed -i "s|<releases>|<releases>\n    <release version=\"$v\" date=\"$(date -u +%F)\"/>|" $m
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --arch=${{ matrix.arch }} --repo=repo builddir io.github.nolsen42.ClipHarbor.yml
          tar -cf ../../flatpak-${{ matrix.arch }}.tar repo

      - uses: actions/upload-artifact@v6
        with:
          name: flatpak-${{ matrix.arch }}
          path: flatpak-${{ matrix.arch }}.tar
          retention-days: 3

  # Releases: attach every build. For the Run workflow button, also create the tag and the release.
  release:
    # A failed Android build doesn't hold up the desktop release (it just has no APK).
    if: always() && needs.plan.outputs.release == 'true' && needs.build.result == 'success' && needs.browser-extension.result == 'success'
    needs: [plan, build, browser-extension, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: ClipHarbor-*
          path: files
          merge-multiple: true

      # The Run workflow button needs the secret RELEASE_TOKEN: GitHub won't let the built-in token create a
      # tag on commits that changed this workflow file. See "Publishing a release" in the README.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
          TAG: ${{ needs.plan.outputs.tag }}
          NEW: ${{ needs.plan.outputs.new_release }}
        run: |
          mv files/ClipHarbor.exe files/ClipHarbor-windows-x64.exe
          ls -la files
          if [ "$NEW" = "true" ] && [ "$HAS_RELEASE_TOKEN" != "true" ]; then
            echo "::warning::No RELEASE_TOKEN secret is set, so GitHub may refuse to create the tag (HTTP 403). See 'Publishing a release' in the README."
          fi
          if [ "$NEW" = "true" ]; then
            # What's new = the commit titles since the last release (the app's updater shows these).
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
            git log --no-merges --pretty='- %s' ${last:+$last..}HEAD > notes.md
            [ -s notes.md ] || echo "- Small fixes and improvements" > notes.md
            cat notes.md
            gh release create "$TAG" files/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          else
            gh release upload "$TAG" files/* --clobber --repo "$GITHUB_REPOSITORY"
          fi

  # Releases: the Flatpak repository on the website (GitHub Pages), so Linux users can add it once and
  # get updates through Discover / GNOME Software. Both processor types go into one signed repository.
  # Needs the secret FLATPAK_GPG_KEY (packaging/flatpak/README.md); without it this is skipped.
  # The repository is also attached to the release, so a website-only update can publish it again.
  flatpak-publish:
    needs: [plan, flatpak, release]
    if: always() && needs.release.result == 'success' && needs.flatpak.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.repo.outputs.published }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: flatpak-*
          path: parts
          merge-multiple: true

      - id: repo
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "::warning::No FLATPAK_GPG_KEY secret is set, so the Flatpak repository isn't published. See packaging/flatpak/README.md."
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq flatpak ostree >/dev/null
          echo "$GPG_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          app=io.github.nolsen42.ClipHarbor
          ostree init --mode=archive-z2 --repo=site/repo
          for a in x86_64 aarch64; do
            mkdir -p parts/$a && tar -xf parts/flatpak-$a.tar -C parts/$a
            ostree pull-local --repo=site/repo parts/$a/repo app/$app/$a/master
            flatpak build-sign --gpg-sign=$key site/repo $app master --arch=$a
          done
          flatpak build-update-repo --gpg-sign=$key --prune site/repo
          # Files people open to add ClipHarbor: .flatpakref installs the app, .flatpakrepo adds the repository.
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          pub=$(gpg --export "$key" | base64 -w0)
          printf '%s\n' '[Flatpak Ref]' "Name=$app" 'Branch=master' 'Title=ClipHarbor' "Url=$site/flatpak/repo/" \
            'SuggestRemoteName=clipharbor' 'IsRuntime=false' 'RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo' \
            "Homepage=$site/" "Icon=$site/icon-256.png" "GPGKey=$pub" > site/clipharbor.flatpakref
          printf '%s\n' '[Flatpak Repo]' 'Title=ClipHarbor' "Url=$site/flatpak/repo/" "Homepage=$site/" \
            'Comment=ClipHarbor video and audio downloader' "Icon=$site/icon-256.png" "GPGKey=$pub" > site/clipharbor.flatpakrepo
          # One-file installers too, for people who'd rather download a file.
          flatpak build-bundle --arch=x86_64 --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo site/repo ClipHarbor-linux-x64.flatpak $app master
          flatpak build-bundle --arch=aarch64 --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo site/repo ClipHarbor-linux-arm64.flatpak $app master
          tar -cf ClipHarbor-flatpak-repo.tar -C site .
          ls -la . site
          gh release upload "$TAG" ClipHarbor-flatpak-repo.tar ClipHarbor-linux-x64.flatpak ClipHarbor-linux-arm64.flatpak --clobber --repo "$GITHUB_REPOSITORY"
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Puts the website and the new Flatpak repository online.
  pages:
    needs: flatpak-publish
    if: always() && needs.flatpak-publish.outputs.published == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write